function chartCard(title,unit,data,pred,big,note){return `<div class="chart-card"><div class="chart-head"><div><h3>${title}</h3><span class="subtitle" style="font-size:12px">${note}</span></div><div class="big">${big}</div></div><div class="spark">${sparkline(data,pred)}</div><div class="month-labels">${state.months.map(x=>`<span>${x.m}</span>`).join('')}<span>Aug</span></div></div>`}
function sparkline(data,pred){const all=[...data,pred], min=Math.min(...all),max=Math.max(...all),w=600,h=140,p=10;const pt=(v,i)=>{const x=p+i*(w-2*p)/(all.length-1),y=h-p-(v-min)/(max-min||1)*(h-2*p);return [x,y]};const pts=data.map((v,i)=>pt(v,i)).map(a=>a.join(',')).join(' ');const last=pt(data.at(-1),data.length-1),fp=pt(pred,data.length);return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="grid" x1="0" y1="35" x2="600" y2="35"/><line class="grid" x1="0" y1="70" x2="600" y2="70"/><line class="grid" x1="0" y1="105" x2="600" y2="105"/><polyline class="line" points="${pts}"/><line class="forecast" x1="${last[0]}" y1="${last[1]}" x2="${fp[0]}" y2="${fp[1]}"/><circle class="dot" cx="${last[0]}" cy="${last[1]}" r="5"/></svg>`}
function forecast(data){const n=data.length, sx=data.reduce((a,_,i)=>a+i,0), sy=data.reduce((a,b)=>a+b,0), sxy=data.reduce((a,b,i)=>a+i*b,0), sx2=data.reduce((a,_,i)=>a+i*i,0);const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx||1), intercept=(sy-slope*sx)/n;return intercept+slope*n}

function bindScreenEvents(){
  $$('[data-nav]').forEach(b=>b.onclick=()=>{state.active=b.dataset.nav;saveState();render();scrollTo({top:0,behavior:'smooth'})});
  $('#wareSlider')?.addEventListener('input',updateLevers);$('#wasteSlider')?.addEventListener('input',updateLevers);$('#priceSlider')?.addEventListener('input',updateLevers);updateLevers();
  $('#saveProfile')?.addEventListener('click',()=>{state.profile.contract=$('#contract').value;state.openingDays=+$(`#openingDays`).value||state.openingDays;state.profile.employees=+$(`#employees`).value||state.profile.employees;state.profile.seats=+$(`#seats`).value||state.profile.seats;state.profile.costCenters=$('#costCenters').value;saveState();toast('Betriebsprofil gespeichert')});
  if($('#contract'))$('#contract').value=state.profile.contract;
  $$('[data-source]').forEach(b=>b.onclick=()=>{const k=b.dataset.source;if(k==='monthly')return;state.sources[k]=!state.sources[k];saveState();render();toast(state.sources[k]?'Quelle aktiviert':'Quelle deaktiviert')});
  $$('[data-rev]').forEach(b=>b.onclick=()=>{const k=b.dataset.rev;if(k==='restaurant')return;state.revenueSources[k]=!state.revenueSources[k]; if(k==='automats')state.sources.automats=state.revenueSources[k]; saveState();render()});
  $$('[data-source-upload]').forEach(b=>b.onclick=()=>openSourceModal(b.dataset.source));
}
function updateLevers(){
  const c=calc(), w=$('#wareSlider'), wa=$('#wasteSlider'), p=$('#priceSlider');
  if(w){const v=+w.value,save=(c.warePct-v)/100*state.revenue;$('#wareSliderValue').textContent=v.toFixed(1).replace('.',',')+' %';$('#wareImpact').innerHTML=impactHTML(save,save*12,'DB1-Effekt','Jahreseffekt')}
  if(wa){const v=+wa.value, grams=Math.max(0,state.waste-v)*state.meals,save=grams*.0065;$('#wasteSliderValue').textContent=Math.round(v)+' g';$('#wasteImpact').innerHTML=impactHTML(save,grams/1000,'möglicher Monatswert','kg weniger Waste')}
  if(p){const v=+p.value, delta=(v-state.avgPrice)*state.meals;$('#priceSliderValue').textContent=v.toFixed(2).replace('.',',')+' €';$('#priceImpact').innerHTML=impactHTML(delta,(v-state.avgPrice),'Umsatzeffekt','€ je Essen')}
}
function impactHTML(a,b,l1,l2){return `<div><small>${l1}</small><strong>${typeof a==='number'?euro.format(a):a}</strong></div><div><small>${l2}</small><strong>${l2.includes('kg')?Number(b).toFixed(1).replace('.',',')+' kg':l2.includes('€ je')?Number(b).toFixed(2).replace('.',',')+' €':euro.format(b)}</strong></div>`}
function observeReveals(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');io.unobserve(e.target)}}),{threshold:.25});$$('.revealable').forEach(el=>io.observe(el))}
function animateCounters(){$$('.counter').forEach(el=>{const target=+el.dataset.value,suffix=el.dataset.suffix||'',start=performance.now(),dur=800;function tick(t){const p=Math.min(1,(t-start)/dur),v=target*(1-Math.pow(1-p,3));el.textContent=v.toFixed(1).replace('.',',')+suffix;if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}

function openMonthModal(){const c=calc();openModal(`<h2>Monatsabschluss hinzufügen</h2><p class="subtitle">Einmal im Monat. MetriQ versucht Excel automatisch zu lesen. Wenn etwas nicht erkannt wird, bleiben deine bestehenden Werte erhalten.</p><div class="dropzone"><b>Excel / CSV auswählen</b><br><input id="monthFile" type="file" accept=".xlsx,.xls,.csv"></div><div class="parse-log">Erkannt werden u. a. Umsatz/Nettoerlös, Wareneinsatz, Personal, Sachkosten, DB1, Ergebnis, Essenszahlen und Öffnungstage. Die Datei wird im Browser verarbeitet.</div><div style="display:flex;gap:10px;margin-top:18px"><button id="demoScan" class="ghost-btn">Demo-Scan</button><button id="manualMonth" class="primary-btn">Werte manuell</button></div>`);$('#monthFile').onchange=e=>parseWorkbook(e.target.files[0]);$('#demoScan').onclick=()=>startTour(true);$('#manualMonth').onclick=openManualMonth}
function openManualMonth(){const c=calc();openModal(`<h2>Monatswerte</h2><div class="profile-grid"><div class="field"><label>Nettoerlös</label><input id="mRevenue" type="number" value="${state.revenue}"></div><div class="field"><label>Wareneinsatz</label><input id="mWare" type="number" value="${state.ware}"></div><div class="field"><label>Personal</label><input id="mPersonal" type="number" value="${state.personal}"></div><div class="field"><label>Sachkosten</label><input id="mSach" type="number" value="${state.sach}"></div><div class="field"><label>Essenszahlen</label><input id="mMeals" type="number" value="${state.meals}"></div><div class="field"><label>Öffnungstage</label><input id="mDays" type="number" value="${state.openingDays}"></div></div><button id="saveMonth" class="primary-btn" style="margin-top:18px;width:100%">Monat übernehmen & Deep Scan</button>`);$('#saveMonth').onclick=()=>{state.revenue=+$(`#mRevenue`).value||0;state.ware=+$(`#mWare`).value||0;state.personal=+$(`#mPersonal`).value||0;state.sach=+$(`#mSach`).value||0;state.meals=+$(`#mMeals`).value||state.meals;state.openingDays=+$(`#mDays`).value||state.openingDays;syncCurrentMonth();saveState();closeModal();startTour(true)}}
function syncCurrentMonth(){const c=calc();const m=state.months.at(-1);Object.assign(m,{ware:c.warePct,personal:c.personalPct,db1:c.db1Pct,result:c.result,revenue:state.revenue,meals:state.meals})}
async function parseWorkbook(file){if(!file)return;toast('MetriQ liest deine Datei…');try{let rows=[];if(file.name.toLowerCase().endsWith('.csv')){const txt=await file.text();rows=txt.split(/\r?\n/).map(r=>r.split(/[;,\t]/))}else{if(typeof XLSX==='undefined')await loadXLSX();if(typeof XLSX==='undefined')throw new Error('Excel-Modul nicht geladen');const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true})}
    const found=extractMetrics(rows); if(found.revenue)state.revenue=found.revenue;if(found.ware)state.ware=found.ware;if(found.personal)state.personal=found.personal;if(found.sach)state.sach=found.sach;if(found.meals)state.meals=found.meals;if(found.openingDays)state.openingDays=found.openingDays;syncCurrentMonth();saveState();closeModal();startTour(true);toast(`${Object.keys(found).length} Werte erkannt`)
  }catch(err){toast('Excel konnte nicht gelesen werden – manuell geht immer');console.error(err);openManualMonth()}}
function loadXLSX(){
  return new Promise((resolve,reject)=>{
    if(typeof XLSX!=='undefined') return resolve();
    const existing=document.querySelector('script[data-xlsx-loader]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
    const sc=document.createElement('script');
    sc.dataset.xlsxLoader='1';
    sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    const timer=setTimeout(()=>reject(new Error('Excel-Modul Timeout')),6000);
    sc.onload=()=>{clearTimeout(timer);resolve()};
    sc.onerror=()=>{clearTimeout(timer);reject(new Error('Excel-Modul konnte nicht geladen werden'))};
    document.head.appendChild(sc);
  });
}
function extractMetrics(rows){
  const keys={
    revenue:['nettoerlös','nettoerlöse','umsatz','erlöse','net sales','revenue'],
    ware:['wareneinsatz','materialaufwand','ware','warenverbrauch'],
    personal:['personalkosten','personalaufwand','löhne','gehälter'],
    sach:['sachkosten','sonstige kosten','sonstiger aufwand'],
    meals:['essenszahl','essen','portionen','mahlzeiten'],
    openingDays:['öffnungstage','arbeitstage','betriebstage']
  };
  const out={};
  const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,' ').trim();
  const num=v=>{
    if(typeof v==='number') return v;
    const s=String(v??'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');
    const n=parseFloat(s);
    return Number.isFinite(n)?n:null;
  };
  for(let r=0;r<rows.length;r++){
    for(let c=0;c<rows[r].length;c++){
      const text=norm(rows[r][c]);
      for(const [k,aliases] of Object.entries(keys)){
        if(out[k]) continue;
        if(aliases.some(a=>text.includes(a))){
          const candidates=[rows[r][c+1],rows[r][c+2],rows[r+1]?.[c],rows[r+1]?.[c+1]];
          for(const v of candidates){
            const n=num(v);
            if(n!==null && Math.abs(n)>0){out[k]=Math.abs(n);break;}
          }
        }
      }
    }
  }
  return out;
}
function openSourceModal(key){const names={waste:'FLOSIQ / Food Waste',automats:'Automatenabrechnung',inventory:'Inventur',canteen:'Kantinenreport',hours:'Personalstunden',cash:'Handkasse'};openModal(`<h2>${names[key]||'Datenquelle'}</h2><p class="subtitle">Diese Quelle ergänzt den Monatsabschluss und hilft MetriQ bei der Einordnung.</p><div class="dropzone"><b>Datei auswählen</b><br><input id="sourceFile" type="file" accept=".xlsx,.xls,.csv,.pdf"></div><button id="sourceDone" class="primary-btn" style="margin-top:16px;width:100%">Quelle verbinden</button>`);$('#sourceDone').onclick=()=>{state.sources[key]=true;saveState();closeModal();render();toast(`${names[key]} verbunden`)}}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}$$('[data-close-modal]').forEach(x=>x.onclick=closeModal);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1800)}

function startTour(force=false){closeModal();const ov=$('#tourOverlay');ov.classList.remove('hidden');tourStep1(force)}
function tourStep1(force){const c=$('#tourContent');c.innerHTML=`<div class="tour-logo">${iconMarkup()}</div><div class="tour-kicker">METRIQ DEEP SCAN</div><h1 class="tour-title">Deine Excel war nie langweilig.<br>Sie wurde nur nie so gelesen.</h1><p class="tour-sub">Jetzt hast du ein zweites Paar Augen, das Zahlen prüft, Leistung erkennt und dir zeigt, wo dein nächster echter Hebel liegt.</p><div class="tour-actions"><button id="scanNow" class="primary-btn">Deep Scan starten →</button><button id="skipTour" class="ghost-btn">Direkt ins Cockpit</button></div>`;$('#scanNow').onclick=tourStep2;$('#skipTour').onclick=endTour}
function tourStep2(){const c=$('#tourContent');c.innerHTML=`<div class="tour-logo" style="width:105px;height:105px">${iconMarkup()}</div><div class="tour-kicker">DER CORE WIRD AKTIV</div><h1 class="tour-title">Ich lese deinen Monat.</h1><p class="tour-sub">Vier Ebenen. Ein Bild deines Betriebs.</p><div class="scan-status"><div class="scan-step" id="s1"><i></i>Struktur des Monatsabschlusses erkennen</div><div class="scan-step" id="s2"><i></i>Kennzahlen und DB1 berechnen</div><div class="scan-step" id="s3"><i></i>Kostenblöcke und Auffälligkeiten prüfen</div><div class="scan-step" id="s4"><i></i>Erste Hebel und Zusammenhänge ableiten</div></div>`;[1,2,3,4].forEach((n,i)=>setTimeout(()=>$('#s'+n)?.classList.add('done'),500+i*560));setTimeout(tourStep3,3100)}
function tourStep3(){const c=calc(),max=Math.max(state.personal,state.ware,state.sach);$('#tourContent').innerHTML=`<div class="tour-kicker">02 · DEIN KOSTENFINGERABDRUCK</div><h1 class="tour-title" style="font-size:48px">Die Balken zeigen, was deinen Monat prägt.</h1><p class="tour-sub">Jeder Block wächst aus den echten Zahlen deines Abschlusses.</p><div class="tour-bars"><div class="tour-bar"><b>${euro.format(state.personal)}</b><div class="col" style="--h:${state.personal/max*100}%"></div><span>Personal</span><small>${pct(c.personalPct)}</small></div><div class="tour-bar"><b>${euro.format(state.ware)}</b><div class="col" style="--h:${state.ware/max*100}%"></div><span>Ware</span><small>${pct(c.warePct)}</small></div><div class="tour-bar"><b>${euro.format(state.sach)}</b><div class="col" style="--h:${Math.max(16,state.sach/max*100)}%"></div><span>Sachkosten</span><small>${pct(c.sachPct)}</small></div></div><div class="tour-note"><b>MetriQ sieht:</b> Ware und Personal liegen fast gleichauf. Dein DB1 beträgt ${pct(c.db1Pct)} – deshalb lohnt sich der erste Blick auf Warensteuerung, Waste und Einkaufsstruktur.</div><div class="tour-actions" style="margin-top:24px"><button id="tourNext" class="primary-btn">Weiter →</button></div>`;$('#tourNext').onclick=tourStep4}
function tourStep4(){const c=calc();$('#tourContent').innerHTML=`<div class="tour-final"><div class="tour-logo">${iconMarkup()}</div><div class="tour-kicker">METRIQ IST BEREIT</div><h1 class="tour-title">Deine Excel war nie langweilig. Sie wurde nur nie so gelesen.</h1><p class="tour-sub">DB1 ${pct(c.db1Pct)} · Wareneinsatz ${pct(c.warePct)} · Ergebnis ${euro.format(c.result)}. Und ab jetzt lernt MetriQ mit jedem Monat dazu.</p><div class="tour-actions"><button id="openCockpit" class="primary-btn">Mein Cockpit öffnen →</button></div><p style="color:#6f6a77;font-size:12px;margin-top:24px">${state.model} wurde bei der Einordnung berücksichtigt.</p></div>`;$('#openCockpit').onclick=endTour}
function endTour(){localStorage.setItem('metriq_tour_done','1');$('#tourOverlay').classList.add('hidden');state.active='cockpit';saveState();render();scrollTo({top:0,behavior:'smooth'})}

$$('.nav-item').forEach(b=>b.onclick=()=>{state.active=b.dataset.nav;saveState();render()});$('#monthFab').onclick=openMonthModal;$('#themeBtn').onclick=()=>document.body.classList.toggle('quiet');
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
render();
const qp=new URLSearchParams(location.search);if(qp.get('tour')==='1'||!localStorage.getItem('metriq_tour_done'))setTimeout(()=>startTour(),120);

</script>
