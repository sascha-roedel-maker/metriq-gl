<body>
  <div id="appShell" class="app-shell">
    <header class="topbar glass">

        </span>
        <span class="brand-word">metri<span>Q</span></span><span class="gl-badge">GL</span>

    <main id="screenHost" class="screen-host" aria-live="polite"></main>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const euro=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const pct=n=>`${Number(n).toFixed(1).replace('.',',')} %`;
const fmt=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(n);

const APP_VERSION='5.2-live-month';
const defaultState={
  active:'live', monthMode:'cockpit', month:'Demo', monthShort:'--/--', site:'RIBE Schwabach', model:'Betriebsmodell noch nicht erkannt',
  revenue:35000, ware:15000, personal:14500, sach:2500, db1:3000, totalCosts:32000,
  meals:860, openingDays:22, waste:92, avgPrice:5.4,
  targets:{ware:44,db1:null,waste:70},
  liveGoals:{revenue:35000,meals:860,db1:2500,waste:70,ware:44},
  live:{monthKey:null,entries:[],lastFinalCheck:null},
  months:[
    {m:'Jan',ware:43.4,personal:42.7,db1:7.6,result:2500,revenue:32900,meals:820},
    {m:'Feb',ware:42.8,personal:43.2,db1:7.1,result:2400,revenue:33800,meals:840},
    {m:'Mrz',ware:41.9,personal:42.5,db1:8.2,result:2850,revenue:34700,meals:910},
    {m:'Apr',ware:44.6,personal:42.9,db1:6.7,result:2250,revenue:33600,meals:875},
    {m:'Mai',ware:43.8,personal:43.1,db1:7.4,result:2550,revenue:34400,meals:900},
    {m:'Jun',ware:44.2,personal:43.4,db1:6.9,result:2320,revenue:33700,meals:850},
    {m:'Jul',ware:42.9,personal:41.4,db1:8.6,result:3000,revenue:35000,meals:860}
  ],
  sources:{monthly:true,canteen:false,automats:false,waste:false,hours:false,inventory:false,cash:false},
  revenueSources:{restaurant:true,automats:false,cash:false,catering:false,conference:false},
  profile:{contract:'Subvention',employees:4,seats:80,costCenters:'Restaurant'},
  importInfo:{type:'demo',sheet:null,file:null}
};
let state=loadState();
function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem('metriq_state')||'{}');
    const s={...structuredClone(defaultState),...saved};
    s.targets={...defaultState.targets,...(saved.targets||{})};
    s.liveGoals={...defaultState.liveGoals,...(saved.liveGoals||{})};
    s.live={...defaultState.live,...(saved.live||{})};
    s.live.entries=Array.isArray(saved.live?.entries)?saved.live.entries:[];
    s.sources={...defaultState.sources,...(saved.sources||{})};
    s.revenueSources={...defaultState.revenueSources,...(saved.revenueSources||{})};
    s.profile={...defaultState.profile,...(saved.profile||{})};
    s.importInfo={...defaultState.importInfo,...(saved.importInfo||{})};
    const rev=Number(s.revenue)||0, wp=rev?Number(s.ware)/rev*100:0, pp=rev?Number(s.personal)/rev*100:0;
    if(!Number.isFinite(wp)||!Number.isFinite(pp)||wp>300||pp>300){
      ['revenue','ware','personal','sach','db1','totalCosts','month','monthShort','model','months','importInfo'].forEach(k=>s[k]=structuredClone(defaultState[k]));
      s._repaired=true;
      localStorage.removeItem('metriq_tour_done');
    }
    return s;
  }catch{return structuredClone(defaultState)}
}
function saveState(){localStorage.setItem('metriq_state',JSON.stringify({...state,_repaired:undefined,appVersion:APP_VERSION}))}
function calc(){
  const revenue=Number(state.revenue)||0, ware=Number(state.ware)||0, personal=Number(state.personal)||0, sach=Number(state.sach)||0;
  const warePct=revenue?ware/revenue*100:0, personalPct=revenue?personal/revenue*100:0, sachPct=revenue?sach/revenue*100:0;
  const totalCosts=Number.isFinite(Number(state.totalCosts))&&Number(state.totalCosts)>0?Number(state.totalCosts):ware+personal+sach;
  const totalCostPct=revenue?totalCosts/revenue*100:0;
  const derivedDb1=revenue-totalCosts;
  const db1=Number.isFinite(Number(state.db1))?Number(state.db1):derivedDb1;
  const db1Pct=revenue?db1/revenue*100:0;
  return {warePct,personalPct,sachPct,totalCosts,totalCostPct,db1,db1Pct,result:db1};
}

const MONTHS_DE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function liveMonthMeta(){
  const d=new Date(), key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if(!state.live.monthKey)state.live.monthKey=key;
  const [y,m]=state.live.monthKey.split('-').map(Number);
  return {key:state.live.monthKey,label:`${MONTHS_DE[m-1]} ${y}`,short:`${String(m).padStart(2,'0')}/${String(y).slice(-2)}`};
}
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function deDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}.${m}.`}
function safeNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function calcLive(){
  const entries=(state.live.entries||[]).filter(e=>e.date?.startsWith(state.live.monthKey||liveMonthMeta().key)).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const days=entries.length;
  const meals=entries.reduce((a,e)=>a+safeNum(e.meals),0);
  const revenue=entries.reduce((a,e)=>a+safeNum(e.revenueRestaurant)+safeNum(e.revenueAutomats)+safeNum(e.revenueCash)+safeNum(e.revenueOther),0);
  const goods=entries.reduce((a,e)=>a+safeNum(e.goods),0);
  const wasteMeals=entries.reduce((a,e)=>a+(safeNum(e.waste)>0?safeNum(e.meals):0),0);
  const wasteWeighted=entries.reduce((a,e)=>a+(safeNum(e.waste)>0?safeNum(e.waste)*safeNum(e.meals):0),0);
  const wasteAvg=wasteMeals?wasteWeighted/wasteMeals:0;
  const goodsRate=revenue?goods/revenue*100:0;
  const opening=Math.max(1,safeNum(state.openingDays)||22);
  const structuralMonthly=Math.max(0,safeNum(state.totalCosts)-safeNum(state.ware));
  const structuralPerDay=structuralMonthly/opening;
  const liveDb1=revenue-goods-structuralPerDay*days;
  const revenuePerMeal=meals?revenue/meals:0;
  const mealPerDay=days?meals/days:0;
  return {entries,days,meals,revenue,goods,wasteAvg,goodsRate,liveDb1,revenuePerMeal,mealPerDay,opening,structuralMonthly,structuralPerDay};
}
function clampPct(n){return Math.max(0,Math.min(100,Number.isFinite(n)?n:0))}
function progressPct(value,target){return target>0?clampPct(value/target*100):0}
function inverseGoalPct(value,target){
  if(!value||!target)return 0;
  if(value<=target)return 100;
  return clampPct(target/value*100);
}
function latestLiveEntry(){const l=calcLive();return l.entries.at(-1)||null}
function currentContextEvents(){return calcLive().entries.filter(e=>e.eventType&&e.eventType!=='Keine')}
function liveGoalStatus(){
  const l=calcLive(), g=state.liveGoals;
  return {
    revenueP:progressPct(l.revenue,g.revenue),
    mealsP:progressPct(l.meals,g.meals),
    db1P:progressPct(Math.max(0,l.liveDb1),Math.max(1,g.db1)),
    wasteP:l.wasteAvg?inverseGoalPct(l.wasteAvg,g.waste):0,
    goodsP:l.goodsRate?inverseGoalPct(l.goodsRate,g.ware):0
  }
}
function monthTabs(){
  return `<div class="segment"><button data-month-mode="cockpit" class="${state.monthMode!=='analyse'?'active':''}">Monatscockpit</button><button data-month-mode="analyse" class="${state.monthMode==='analyse'?'active':''}">Deep Scan Analyse</button></div>
  <div class="month-upload-bar"><div><b>${state.month==='Demo'?'Noch kein verifizierter Abschluss':'Verifizierter Abschluss: '+state.month}</b><small>${state.importInfo?.audit?.sheetCount?`${state.importInfo.audit.sheetCount} Tabellenblätter im Deep Scan geprüft`:'Monatsabschluss bildet die wirtschaftliche Wahrheit'}</small></div><button class="primary-btn" data-open-close style="padding:10px 12px">＋ Abschluss</button></div>`;
}
function auditStrip(){
  const a=state.importInfo?.audit;
  if(!a)return '';
  return `<div class="audit-strip"><div><b>${a.sheetCount||0}</b><small>Blätter geprüft</small></div><div><b>${a.verified||0}</b><small>Kernchecks</small></div><div><b>${a.conflicts||0}</b><small>Konflikte</small></div></div>`;
}

function iconMarkup(){return `<svg viewBox="0 0 64 64" fill="none"><circle cx="28" cy="28" r="18" stroke="white" stroke-width="5"/><path d="M41 41l12 12" stroke="white" stroke-width="6" stroke-linecap="round"/><rect x="18" y="29" width="5" height="10" rx="2.5" fill="#6ef0d7"/><rect x="27" y="23" width="5" height="16" rx="2.5" fill="#6ef0d7"/><rect x="36" y="17" width="5" height="22" rx="2.5" fill="#6ef0d7"/><path d="M47 9l2.2 5.5L55 17l-5.8 2.2L47 25l-2.2-5.8L39 17l5.8-2.5z" fill="#ffe873"/></svg>`}

function render(){
  if(!['live','monat','hebel','verlauf','betrieb'].includes(state.active))state.active='live';
  $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.active));
  const host=$('#screenHost');
  const views={live:liveView,monat:()=>state.monthMode==='analyse'?analyseView():cockpitView(),hebel:hebelView,verlauf:verlaufView,betrieb:betriebView};
  host.innerHTML=views[state.active]();
  const fab=$('#monthFab'),label=$('#monthFab span');
  if(state.active==='monat'){if(label)label.textContent='Abschluss';fab.setAttribute('aria-label','Monatsabschluss hinzufügen')}
  else{if(label)label.textContent='Heute';fab.setAttribute('aria-label','Tagesdaten hinzufügen')}
  requestAnimationFrame(()=>{observeReveals();bindScreenEvents();animateCounters()});
}
function liveView(){
  const lm=liveMonthMeta(), l=calcLive(), g=state.liveGoals, s=liveGoalStatus(), last=latestLiveEntry(), events=currentContextEvents();
  const dayText=`${l.days} von ${l.opening} erfassten Öffnungstagen`;
  const db1Text=l.days?euro.format(l.liveDb1):'—';
  const goodsText=l.goodsRate?pct(l.goodsRate):'—';
  const wasteText=l.wasteAvg?`${l.wasteAvg.toFixed(0)} g`:'—';
  return `<section class="screen"><div class="eyebrow">METRIQ LIVE · ${lm.short}</div><h1 class="title">Dein Monat entsteht gerade.</h1><p class="subtitle">${state.site} · echte Ist-Daten statt Prognosen. ProphetIQ schaut nach vorne – MetriQ zeigt, was bis heute wirklich passiert ist.</p>
    <div class="live-hero">
      <div class="live-topline"><div><div class="eyebrow">LIVE-MONAT</div><h2>${lm.label}</h2><p>${dayText}. Jede Eingabe verbessert deine laufende wirtschaftliche Sicht.</p></div><span class="live-day-badge">${l.days?Math.round(l.days/l.opening*100):0}% erfasst</span></div>
      <div class="live-metric-grid">
        <div class="live-metric"><small>Nettoerlös erfasst</small><strong>${euro.format(l.revenue)}</strong><em>${g.revenue?`${Math.round(s.revenueP)} % vom Monatsziel`:''}</em></div>
        <div class="live-metric"><small>Essen erfasst</small><strong>${fmt(l.meals)}</strong><em>${l.days?`${l.mealPerDay.toFixed(1).replace('.',',')} Ø / Tag`:'noch keine Tage'}</em></div>
        <div class="live-metric"><small>Warenzugang</small><strong>${euro.format(l.goods)}</strong><em>${goodsText} vom erfassten Erlös</em></div>
        <div class="live-metric"><small>DB1 Live-Trend*</small><strong>${db1Text}</strong><em>vorläufiger Steuerungswert</em></div>
      </div>
      <div class="live-warning ${l.days?'good':''}">${l.days?`* Der Live-Trend nutzt deine tatsächlichen Tageserlöse und Warenzugänge plus zeitanteilige Strukturkosten aus dem letzten verifizierten Abschluss. Inventur, Abgrenzungen und der Monatsabschluss können den endgültigen DB1 noch verändern.`:`Noch keine Tagesdaten vorhanden. Mit Essen, Erlös und Warenzugang baut MetriQ ab heute deinen Live-Monat auf.`}</div>
      <div class="live-actions"><button class="primary-btn" data-open-daily>＋ Heute eintragen</button><button class="ghost-btn" data-open-goals>🎯 Monatsziele</button></div>
    </div>

    <div class="section-head"><div><div class="eyebrow">ZIELSPUR</div><h2>Wie nah du deinen Zielen kommst</h2></div><span class="chip">${l.days?`${l.days} Tage Daten`:'Startklar'}</span></div>
    <div class="progress-list">
      ${liveProgress('Nettoerlös',euro.format(l.revenue),euro.format(g.revenue),s.revenueP,`${Math.max(0,g.revenue-l.revenue)>0?euro.format(Math.max(0,g.revenue-l.revenue))+' bis zum Ziel':'Ziel erreicht'}`,'')}
      ${liveProgress('Essenszahlen',fmt(l.meals),fmt(g.meals),s.mealsP,`${Math.max(0,g.meals-l.meals)>0?fmt(Math.max(0,g.meals-l.meals))+' Essen bis zum Ziel':'Ziel erreicht'}`,'')}
      ${liveProgress('Food Waste',wasteText,`${g.waste} g`,s.wasteP,l.wasteAvg?`${Math.abs(l.wasteAvg-g.waste).toFixed(0)} g ${l.wasteAvg<=g.waste?'unter':'über'} Ziel`:'Noch keine Waste-Daten','inverse')}
      ${liveProgress('Warenzugang / Erlös',goodsText,`${pct(g.ware)} Orientierungswert`,s.goodsP,l.goodsRate?`${Math.abs(l.goodsRate-g.ware).toFixed(1).replace('.',',')} PP ${l.goodsRate<=g.ware?'unter':'über'} Orientierung`:'Noch keine Warenzugänge','inverse')}
      ${liveProgress('DB1 Live-Trend',db1Text,euro.format(g.db1),s.db1P,l.days?`${Math.max(0,g.db1-l.liveDb1)>0?euro.format(Math.max(0,g.db1-l.liveDb1))+' bis zum Ziel':'Zielpfad erreicht'}`:'Noch keine Daten','')}
    </div>

    <div class="section-head"><div><div class="eyebrow">HEUTE</div><h2>${last?'Letzter erfasster Tag':'Dein 20-Sekunden-Check'}</h2></div></div>
    ${last?`<div class="today-card"><h3>${deDate(last.date)} · ${last.eventType&&last.eventType!=='Keine'?last.eventType:'Normaler Betriebstag'}</h3><p>${last.note||'Keine Besonderheit erfasst.'}</p><div class="today-stats"><div><small>Essen</small><b>${fmt(last.meals)}</b></div><div><small>Erlös</small><b>${euro.format(safeNum(last.revenueRestaurant)+safeNum(last.revenueAutomats)+safeNum(last.revenueCash)+safeNum(last.revenueOther))}</b></div><div><small>Warenzugang</small><b>${euro.format(last.goods)}</b></div></div></div>`:`<div class="today-card empty"><h3>Heute noch nichts eingetragen.</h3><p>Essenszahl, Tageserlös und Warenzugang reichen für den Start. Besonderheiten nur dann, wenn wirklich etwas passiert ist.</p><button class="primary-btn" data-open-daily style="margin-top:14px">Ersten Tag erfassen →</button></div>`}

    <div class="section-head"><div><div class="eyebrow">BETRIEBSJOURNAL</div><h2>Was den Monat später erklärt</h2></div></div>
    ${events.length?`<div class="event-list">${events.slice().reverse().slice(0,5).map(e=>`<div class="event-item"><div class="event-date">${deDate(e.date)}</div><div><b>${e.eventType}</b><p>${e.note||'ohne Zusatznotiz'}</p></div></div>`).join('')}</div>`:`<div class="insight-card"><div class="insight-icon">✎</div><div><h3>Noch keine Besonderheiten.</h3><p>Events, Lieferprobleme, Fremdpersonal, Schließtage oder Automatenstörungen landen hier. Beim Deep Scan kann MetriQ sie später mit dem Abschluss verbinden.</p></div></div>`}

    <div class="section-head"><div><div class="eyebrow">TAGESVERLAUF</div><h2>Deine letzten Einträge</h2></div></div>

function signed(v,suffix='',dec=1){const n=Number(v)||0;return `${n>0?'+':''}${n.toFixed(dec).replace('.',',')}${suffix}`}
function historyChartCard(title,data,big,note){return `<div class="chart-card"><div class="chart-head"><div><h3>${title}</h3><span class="subtitle" style="font-size:12px">${note}</span></div><div class="big">${big}</div></div><div class="spark">${historySparkline(data)}</div><div class="month-labels">${state.months.map(x=>`<span>${x.m}</span>`).join('')}</div></div>`}
function historySparkline(data){
  if(!data.length)return '';
  const min=Math.min(...data),max=Math.max(...data),w=600,h=140,p=10;
  const pt=(v,i)=>{const x=p+i*(w-2*p)/Math.max(1,data.length-1),y=h-p-(v-min)/(max-min||1)*(h-2*p);return [x,y]};
  const pts=data.map((v,i)=>pt(v,i)).map(a=>a.join(',')).join(' ');
  const lp=pt(data.at(-1),data.length-1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="grid" x1="0" y1="35" x2="600" y2="35"/><line class="grid" x1="0" y1="70" x2="600" y2="70"/><line class="grid" x1="0" y1="105" x2="600" y2="105"/><polyline class="line" points="${pts}"/><circle class="dot" cx="${lp[0]}" cy="${lp[1]}" r="5"/></svg>`;
}

async function parseWorkbook(file){
  if(!file)return;
  toast('MetriQ liest deine Datei…');
  try{
    let found={};
    if(file.name.toLowerCase().endsWith('.csv')){
      const txt=await file.text();
      const rows=txt.split(/\r?\n/).map(r=>r.split(/[;,\t]/));
      found=extractMetrics(rows);
      found.importType='csv';
    }else{
      if(typeof XLSX==='undefined')await loadXLSX();
      if(typeof XLSX==='undefined')throw new Error('Excel-Modul nicht geladen');
      const data=await file.arrayBuffer(), book=XLSX.read(data,{type:'array',cellDates:true});
      found=extractWISAGWorkbook(book);
      if(!found || !found.revenue){
        found=extractGenericWorkbook(book);
        found.importType='generic';
      }else found.importType='wisag';
    }
    if(!found.revenue || found.revenue<=0)throw new Error('Kein plausibler Nettoerlös erkannt');
    if(found.ware!=null)state.ware=found.ware;
    if(found.personal!=null)state.personal=found.personal;
    if(found.sach!=null)state.sach=found.sach;
    state.revenue=found.revenue;
    state.totalCosts=found.totalCosts!=null?found.totalCosts:(state.ware+state.personal+state.sach);
    state.db1=found.db1!=null?found.db1:(state.revenue-state.totalCosts);
    if(found.meals)state.meals=found.meals;
    if(found.openingDays)state.openingDays=found.openingDays;
    if(found.month)state.month=found.month;
    if(found.monthShort)state.monthShort=found.monthShort;
    if(found.model)state.model=found.model;
    state.importInfo={type:found.importType||'excel',sheet:found.sheet||null,file:file.name,audit:found.audit||null};
    if(found.importType==='wisag'&&found.audit?.blocked)throw new Error('WISAG Deep Scan: Kernwerte widersprechen sich');
    const c=calc();
    if(c.warePct>200||c.personalPct>200)throw new Error('Unplausible Quote erkannt – Import abgebrochen');
    syncCurrentMonth();
    saveState();
    closeModal();
    startTour(true);
    toast(`${found.audit?.sheetCount||1} Blätter geprüft · ${found.audit?.conflicts||0} Konflikte`);
  }catch(err){
    console.error(err);
    toast('Datei erkannt, aber Kennzahlen nicht sicher genug – bitte manuell prüfen');
    openManualMonth();
  }
}
function loadXLSX(){
  return new Promise((resolve,reject)=>{
    if(typeof XLSX!=='undefined') return resolve();
    const existing=document.querySelector('script[data-xlsx-loader]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
    const sc=document.createElement('script');
    sc.dataset.xlsxLoader='1';
    sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    const timer=setTimeout(()=>reject(new Error('Excel-Modul Timeout')),8000);
    sc.onload=()=>{clearTimeout(timer);resolve()};
    sc.onerror=()=>{clearTimeout(timer);reject(new Error('Excel-Modul konnte nicht geladen werden'))};
    document.head.appendChild(sc);
  });
}
function normText(s){return String(s??'').toLowerCase().replace(/\s+/g,' ').trim()}
function toNum(v){
  if(typeof v==='number' && Number.isFinite(v))return v;
  if(v==null||v==='')return null;
  let s=String(v).trim().replace(/\s/g,'').replace(/€/g,'').replace(/%/g,'');
  if(/^[-+]?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  s=s.replace(/[^0-9.+-]/g,'');
  const n=parseFloat(s); return Number.isFinite(n)?n:null;
}
function rowsOf(book,sheetName){return XLSX.utils.sheet_to_json(book.Sheets[sheetName],{header:1,raw:true,defval:null})}
function exactValue(rows,label){
  const want=normText(label); let value=null;
  for(const row of rows){
    if(normText(row?.[0])===want){
      for(let c=1;c<Math.min(row.length,6);c++){const n=toNum(row[c]);if(n!==null&&Math.abs(n)>0)value=n}
    }
  }
  return value;
}
function parseMonthLabel(v){
  const s=String(v??'').trim(), months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const m=s.match(/(20\d{2}).*?(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)/i);
  if(!m)return {};
  const year=+m[1], name=months.find(x=>x.toLowerCase()===m[2].toLowerCase())||m[2], idx=months.indexOf(name)+1;
  return {month:`${name} ${year}`,monthShort:`${String(idx).padStart(2,'0')}/${String(year).slice(-2)}`};
}

function scanWorkbookAudit(book,core){
  const sheetProfiles=[];
  for(const name of book.SheetNames){
    const rows=rowsOf(book,name);
    let nonEmpty=0,numeric=0,text=0;
    for(const row of rows){
      let rowHas=false;
      for(const v of row){
        if(v!==null&&v!==''){
          rowHas=true;
          if(typeof v==='number'&&Number.isFinite(v))numeric++; else text++;
        }
      }
      if(rowHas)nonEmpty++;
    }
    const n=normText(name);
    let role='Weitere Daten';
    if(n.includes('deckblatt'))role='Stammdaten';
    else if(n.includes('ergebnis'))role='Ergebnis / Teilbetriebe';
    else if(n.includes('sachkosten'))role='Sachkosten';
    else if(n.includes('personalkosten'))role='Personal';
    else if(n.includes('faktura'))role='Faktura';
    else if(n.includes('abgrenz'))role='Abgrenzungen';
    else if(n.includes('handkasse'))role='Handkasse';
    else if(n.includes('transfer'))role='Transfers';
    else if(n.includes('inventur'))role='Inventur';
    else if(n.includes('speisen'))role='Essenszahlen';
    else if(n.includes('erlös')||n.includes('girovend'))role='Erlöse';
    else if(n.includes('budget')||n.includes('planist'))role='Budget / Plan-Ist';
    else if(n.includes('kennzahlen'))role='Kennzahlenhistorie';
    sheetProfiles.push({name,role,nonEmpty,numeric,text});
  }
  const checks=[];
  function check(label,ok,detail){checks.push({label,ok:!!ok,detail})}
  check('Erlös erkannt',Number.isFinite(core.revenue)&&core.revenue>0,euro.format(core.revenue||0));
  check('Wareneinsatz erkannt',Number.isFinite(core.ware)&&core.ware>=0,euro.format(core.ware||0));
  check('Personalkosten erkannt',Number.isFinite(core.personal)&&core.personal>=0,euro.format(core.personal||0));
  check('Gesamtkosten erkannt',Number.isFinite(core.totalCosts)&&core.totalCosts>0,euro.format(core.totalCosts||0));
  check('DB1 erkannt',Number.isFinite(core.db1),euro.format(core.db1||0));
  const reconcile=Math.abs((core.revenue-core.totalCosts)-core.db1);
  check('DB1 rechnerisch bestätigt',reconcile<=1,`Abweichung ${euro.format(reconcile)}`);
  const costReconcile=Math.abs((core.ware+core.personal+core.sach)-core.totalCosts);
  check('Kostenblöcke stimmen zur Gesamtsumme',costReconcile<=1,`Abweichung ${euro.format(costReconcile)}`);
  const conflicts=checks.filter(x=>!x.ok).length;
  return {sheetCount:book.SheetNames.length,nonEmptySheets:sheetProfiles.filter(x=>x.nonEmpty>0).length,verified:checks.filter(x=>x.ok).length,conflicts,checks,sheets:sheetProfiles};
}

function extractWISAGWorkbook(book){
  const quick=book.SheetNames.find(n=>normText(n)==='ergebnisblatt schnelle zahlen');
  if(!quick)return null;
  const rows=rowsOf(book,quick);
  const revenue=exactValue(rows,'Erlöse Gesamt');
  const wareFood=exactValue(rows,'Wareneinsatz Food')||0;
  const wareNonFood=exactValue(rows,'Wareneinsatz Non-Food')||0;
  const personal=exactValue(rows,'PK Gesamt');
  const sach=exactValue(rows,'operative Sachkosten');
  const totalCosts=exactValue(rows,'Gesamtkosten');
  const db1=exactValue(rows,'DB 1');
  let monthInfo={};
  for(const row of rows)if(normText(row?.[0])==='jahr, monat:')monthInfo=parseMonthLabel(row?.[1]);
  let model=null;
  const deck=book.SheetNames.find(n=>normText(n)==='deckblatt');
  if(deck){
    const deckRows=rowsOf(book,deck);
    const flat=deckRows.flat().map(normText).join(' ');
    if(flat.includes('kostenplus')||flat.includes('kosten-plus'))model='Kosten-plus';
    else if(flat.includes('subvention'))model='Subvention';
  }
  const out={sheet:quick,revenue,ware:wareFood+wareNonFood,wareFood,wareNonFood,personal,sach,totalCosts,db1,model,...monthInfo};
  out.audit=scanWorkbookAudit(book,out);
  if(out.audit.conflicts>0)out.audit.blocked=true;
  return out;
}
function extractGenericWorkbook(book){
  const preferred=[...book.SheetNames].sort((a,b)=>{
    const score=n=>/ergebnis|kennzahl|summary|übersicht/i.test(n)?0:1;
    return score(a)-score(b);
  });
  let best={};
  for(const name of preferred){
    const rows=rowsOf(book,name), f=extractMetrics(rows);
    if(Object.keys(f).length>Object.keys(best).length)best={...f,sheet:name};
    if(best.revenue&&best.ware&&best.personal&&best.sach)break;
  }
  if(best.revenue&&best.totalCosts==null&&best.ware!=null&&best.personal!=null&&best.sach!=null)best.totalCosts=best.ware+best.personal+best.sach;
  if(best.revenue&&best.db1==null&&best.totalCosts!=null)best.db1=best.revenue-best.totalCosts;
  if(best.revenue)best.audit=scanWorkbookAudit(book,best);
  return best;
}
function extractMetrics(rows){
  const aliases={
    revenue:['nettoerlös','nettoerlöse','erlöse gesamt','umsatz'],
    ware:['wareneinsatz gesamt','wareneinsatz','materialaufwand'],
    personal:['pk gesamt','personalkosten','personalaufwand'],
    sach:['operative sachkosten','sachkosten'],
    totalCosts:['gesamtkosten','summe kosten'],
    db1:['db 1','db1'],
    meals:['essenszahl','essenszahlen','portionen','mahlzeiten'],
    openingDays:['öffnungstage','betriebstage','arbeitstage']
  };
  const out={};
  for(const row of rows){
    for(let c=0;c<row.length;c++){
      const text=normText(row[c]);
      if(!text)continue;
      for(const [k,list] of Object.entries(aliases)){
        if(out[k]!=null)continue;
        if(list.some(a=>text===a||text.startsWith(a+' '))){
          const candidates=[row[c+1],row[c+2],row[c+3]];
          for(const v of candidates){const n=toNum(v);if(n!==null&&Math.abs(n)>0){out[k]=Math.abs(n);break}}
        }
      }
    }
  }
  return out;
}
function openSourceModal(key){const names={waste:'FLOSIQ / Food Waste',automats:'Automatenabrechnung',inventory:'Inventur',canteen:'Kantinenreport',hours:'Personalstunden',cash:'Handkasse'};openModal(`<h2>${names[key]||'Datenquelle'}</h2><p class="subtitle">Diese Quelle ergänzt den Monatsabschluss und hilft MetriQ bei der Einordnung.</p><div class="dropzone"><b>Datei auswählen</b><br><input id="sourceFile" type="file" accept=".xlsx,.xls,.csv,.pdf"></div><button id="sourceDone" class="primary-btn" style="margin-top:16px;width:100%">Quelle verbinden</button>`);$('#sourceDone').onclick=()=>{state.sources[key]=true;saveState();closeModal();render();toast(`${names[key]} verbunden`)}}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}$$('[data-close-modal]').forEach(x=>x.onclick=closeModal);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1800)}

function startTour(force=false){closeModal();const ov=$('#tourOverlay');ov.classList.remove('hidden');tourStep1(force)}
function tourStep1(force){const c=$('#tourContent');c.innerHTML=`<div class="tour-logo">${iconMarkup()}</div><div class="tour-kicker">METRIQ DEEP SCAN</div><h1 class="tour-title">Deine Excel war nie langweilig.<br>Sie wurde nur nie so gelesen.</h1><p class="tour-sub">Jetzt hast du ein zweites Paar Augen, das Zahlen prüft, Leistung erkennt und dir zeigt, wo dein nächster echter Hebel liegt.</p><div class="tour-actions"><button id="scanNow" class="primary-btn">Deep Scan starten →</button><button id="skipTour" class="ghost-btn">Direkt zum Monatscockpit</button></div>`;$('#scanNow').onclick=tourStep2;$('#skipTour').onclick=endTour}
function tourStep2(){const c=$('#tourContent');c.innerHTML=`<div class="tour-logo" style="width:105px;height:105px">${iconMarkup()}</div><div class="tour-kicker">DER CORE WIRD AKTIV</div><h1 class="tour-title">Ich lese deinen Monat.</h1><p class="tour-sub">Vier Ebenen. Ein Bild deines Betriebs.</p><div class="scan-status"><div class="scan-step" id="s1"><i></i>Struktur des Monatsabschlusses erkennen</div><div class="scan-step" id="s2"><i></i>Kennzahlen und DB1 berechnen</div><div class="scan-step" id="s3"><i></i>Kostenblöcke und Auffälligkeiten prüfen</div><div class="scan-step" id="s4"><i></i>Erste Hebel und Zusammenhänge ableiten</div></div>`;[1,2,3,4].forEach((n,i)=>setTimeout(()=>$('#s'+n)?.classList.add('done'),500+i*560));setTimeout(tourStep3,3100)}
function tourStep3(){const c=calc(),max=Math.max(state.personal,state.ware,state.sach);$('#tourContent').innerHTML=`<div class="tour-kicker">02 · DEIN KOSTENFINGERABDRUCK</div><h1 class="tour-title" style="font-size:48px">Die Balken zeigen, was deinen Monat prägt.</h1><p class="tour-sub">Jeder Block wächst aus den echten Zahlen deines Abschlusses.</p><div class="tour-bars"><div class="tour-bar"><b>${euro.format(state.personal)}</b><div class="col" style="--h:${state.personal/max*100}%"></div><span>Personal</span><small>${pct(c.personalPct)}</small></div><div class="tour-bar"><b>${euro.format(state.ware)}</b><div class="col" style="--h:${state.ware/max*100}%"></div><span>Ware</span><small>${pct(c.warePct)}</small></div><div class="tour-bar"><b>${euro.format(state.sach)}</b><div class="col" style="--h:${Math.max(16,state.sach/max*100)}%"></div><span>Sachkosten</span><small>${pct(c.sachPct)}</small></div></div><div class="tour-note"><b>MetriQ sieht:</b> Ware und Personal liegen fast gleichauf. Dein DB1 beträgt ${pct(c.db1Pct)} bzw. ${euro.format(c.db1)}. MetriQ übernimmt ihn direkt aus der Monatsabschluss-Logik.</div><div class="tour-actions" style="margin-top:24px"><button id="tourNext" class="primary-btn">Weiter →</button></div>`;$('#tourNext').onclick=tourStep4}
function tourStep4(){const c=calc();$('#tourContent').innerHTML=`<div class="tour-final"><div class="tour-logo">${iconMarkup()}</div><div class="tour-kicker">METRIQ IST BEREIT</div><h1 class="tour-title">Deine Excel war nie langweilig. Sie wurde nur nie so gelesen.</h1><p class="tour-sub">DB1 ${pct(c.db1Pct)} · ${euro.format(c.db1)} · Wareneinsatz ${pct(c.warePct)}. Und ab jetzt lernt MetriQ mit jedem Monat dazu.</p><div class="tour-actions"><button id="openCockpit" class="primary-btn">Monatscockpit öffnen →</button></div><p style="color:#6f6a77;font-size:12px;margin-top:24px">${state.model} wurde bei der Einordnung berücksichtigt.</p></div>`;$('#openCockpit').onclick=endTour}
function endTour(){localStorage.setItem('metriq_tour_done','1');$('#tourOverlay').classList.add('hidden');state.active='monat';saveState();render();scrollTo({top:0,behavior:'smooth'})}

$$('.nav-item').forEach(b=>b.onclick=()=>{state.active=b.dataset.nav;saveState();render()});$('#monthFab').onclick=()=>state.active==='monat'?openMonthModal():openDailyModal();$('#themeBtn').onclick=()=>document.body.classList.toggle('quiet');
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
liveMonthMeta();
if(!state.monthMode)state.monthMode='cockpit';
render();
if(state._repaired)setTimeout(()=>toast('Unplausible Alt-Daten wurden zurückgesetzt – Excel bitte neu importieren'),350);
const qp=new URLSearchParams(location.search);if(qp.get('tour')==='1'||!localStorage.getItem('metriq_tour_done'))setTimeout(()=>startTour(),120);

</script>
