/* ===== V6.2 Theme + FLOSIQ + lever system ===== */
body[data-theme="light"]{
  --bg:#f3f1f7;--panel:#ffffff;--text:#251d45;--muted:#746e7f;--line:rgba(61,42,103,.13);--soft:rgba(82,61,132,.055);--shadow:0 16px 50px rgba(54,40,86,.10);
  background:linear-gradient(180deg,#f7f5fa 0,#f0eef5 55%,#f6f5f8 100%);

body[data-theme="light"] .topbar{background:rgba(248,247,250,.92);border-color:rgba(61,42,103,.10)}
body[data-theme="light"] .brand{color:#281f48}
body[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.92);border-color:rgba(61,42,103,.10);box-shadow:0 -10px 35px rgba(62,45,91,.08)}
body[data-theme="light"] .month-nav{background:rgba(247,245,250,.94);border-color:rgba(61,42,103,.10)}

body[data-theme="light"] .verified-hero{background:linear-gradient(145deg,rgba(92,221,208,.10),#fff 47%,rgba(139,76,255,.07))}
body[data-theme="light"] .kpi,body[data-theme="light"] .panel,body[data-theme="light"] .analysis-card,body[data-theme="light"] .row-card,body[data-theme="light"] .stat-card,body[data-theme="light"] .slider-card,body[data-theme="light"] .source{background:#fff}

body[data-theme="light"] .field input,body[data-theme="light"] .field select,body[data-theme="light"] .field textarea{background:#fff;color:#251d45}
body[data-theme="light"] .chart-tooltip{background:rgba(255,255,255,.96);color:#251d45}
body[data-theme="light"] .notice{background:rgba(255,210,70,.10)}
body[data-theme="light"] .flosiq-card{background:linear-gradient(145deg,#f5fbed,#fff)}
body[data-theme="light"] .lever-card{background:#fff}
body[data-theme="light"] .primary{box-shadow:0 8px 24px rgba(116,77,218,.20)}

  if(Number.isFinite(c.personalPct)&&Number.isFinite(p.personalPct)){const d=pp(c.personalPct,p.personalPct);if(d<=-.5)out.push({tone:'good',icon:'✓',title:`Personalkostenquote ${Math.abs(d).toFixed(1).replace('.',',')} PP niedriger`,copy:`${pct(p.personalPct)} → ${pct(c.personalPct)}. Prüfe dazu Essenszahl und Umsatz – dann siehst du, ob Produktivität dahintersteckt.`});else if(d>=.8)out.push({tone:'watch',icon:'!',title:`Personalkostenquote +${d.toFixed(1).replace('.',',')} PP`,copy:`${pct(p.personalPct)} → ${pct(c.personalPct)}. Das kann an Umsatz, Auslastung oder Fremdpersonal liegen.`})}

  auditCheck(checks,'Wareneinsatz Food',q.wf,totals.ware,['Schnelle Zahlen','Ergebnis Teilbetriebe']);
  auditCheck(checks,'Personalkosten gesamt',q.personal,partPersonal,['Schnelle Zahlen','Ergebnis Teilbetriebe']);
  if(valid(personalCtl.own))auditCheck(checks,'Eigenpersonal',personalCtl.own,totals.personalOwn,['Personalkosten','Ergebnis Teilbetriebe']);
  if((Number(rebCtl.foreign)||0)>0||totals.personalForeign>0)auditCheck(checks,'Fremdpersonal · REB-Abgleich',rebCtl.foreign,totals.personalForeign,['REB','Ergebnis Teilbetriebe'],1,false);

  if(cp.active&&valid(budget.selfCosts)&&Math.abs(Number(budget.selfCosts))>0)auditCheck(checks,'Gesamtkosten · Kosten-plus',q.totalCosts,budget.selfCosts,['Schnelle Zahlen','KP Budgetkontrolle']);
  auditCheck(checks,'DB1 · Rechenweg',q.db1,Number(q.revenue||0)-Number(q.totalCosts||0),['Schnelle Zahlen','Erlös − Gesamtkosten']);
  if(cp.active&&cp.feeRate!==null)auditCheck(checks,'DB1 · Kosten-plus-Gebühr',q.db1,Number(q.totalCosts||0)*cp.feeRate,['Schnelle Zahlen',`Gesamtkosten × ${(cp.feeRate*100).toLocaleString('de-DE',{maximumFractionDigits:2})} %`]);else if(cp.active&&cp.feeAmount!==null)auditCheck(checks,'DB1 · Kosten-plus-Gebühr',q.db1,cp.feeAmount,['Schnelle Zahlen','KP Budgetkontrolle']);
  const monthKeys=[...new Set(coverage.map(x=>x.monthKey).filter(Boolean))],monthOk=monthKeys.length<=1;checks.push({label:'Monatshinweise über Tabellenblätter',ok:monthOk,available:true,critical:false,sources:['alle Blätter'],detail:monthOk?(monthKeys[0]?monthLabel(monthKeys[0]):'kein widersprüchlicher Monat'):`Mehrere Monatsbezüge gefunden: ${monthKeys.map(monthLabel).join(', ')} · kann durch Vormonats-/Vergleichsangaben entstehen`});

function extractWISAG(book,fileName){const q=quickCore(book),key=detectMonth(book);if(!key)throw new Error('Monat nicht erkannt');const inv=extractInventory(book),reb=extractREB(book),parts=extractParts(book),rb=extractRevenueBookings(book),meal=extractMeals(book),budget=extractBudgetControl(book),personalCtl=extractPersonalControl(book),rebCtl=extractREBControl(book),pt=partTotals(parts),fakturaTotal=rb.reduce((a,x)=>a+(Number(x.net)||0),0),cp=costPlusContext(rb,budget);
  const revCandidates=cp.active?[{source:'Schnelle Zahlen',value:q.revenue},{source:'Teilbetriebe + Kostenplus-Abrechnung',value:pt.revenue+cp.invoice}]:[{source:'Schnelle Zahlen',value:q.revenue},{source:'Teilbetriebe',value:pt.revenue},{source:'Faktura',value:fakturaTotal||null}];
  const revC=consensusValue(revCandidates),wfC=consensusValue([{source:'Schnelle Zahlen',value:q.wf},{source:'Teilbetriebe',value:pt.ware}]),perC=consensusValue([{source:'Schnelle Zahlen',value:q.personal},{source:'Teilbetriebe',value:pt.personalOwn+pt.personalForeign}]);
  const sachDerived=pt.sach-Number(q.wn||0),sachC=consensusValue([{source:'Schnelle Zahlen',value:q.sach},{source:'Teilbetriebe minus Non-Food',value:sachDerived}]);

  const core={revenue:revC.value,ware:wfC.value+Number(q.wn||0),wareFood:wfC.value,wareNonFood:Number(q.wn||0),personal:perC.value,sach:sachC.value,totalCosts:totalC.value,db1:dbC.value},audit=buildAudit(book,q,parts,budget,personalCtl,rebCtl,rb,key);if(audit.conflicts){const error=new Error('Deep Scan V7.4: '+audit.conflicts+' echter kritischer Widerspruch'+(audit.conflicts===1?'':'e'));error.audit=audit;throw error}return{siteId:state.workspace.siteId,key,month:monthLabel(key),monthShort:monthShort(key),site:currentSite().name,model:currentSite().contract||state.profile.contract,verified:true,source:fileName,metrics:{...core,meals:meal.meals,openingDays:meal.openingDays},inventory:inv,parts,suppliers:reb.suppliers,transactions:reb.transactions,revenueBookings:rb,dailyMeals:meal.dailyMeals,conferenceCostCenters:conferenceGroups({revenueBookings:rb}),audit,provenance:{revenue:revC,wareFood:wfC,personal:perC,sach:sachC,totalCosts:totalC,db1:dbC,billing:audit.billing}}}
async function parseWorkbook(file){const status=$('#parseStatus');try{if(status)status.textContent='MetriQ liest die Datei lokal und erkennt zuerst, welche Art Daten du ihm gegeben hast …';const data=await file.arrayBuffer();let book;if(/\.xlsx$/i.test(file.name)){book=await readXlsxNative(data)}else{await loadXLSX();book=XLSX.read(data,{type:'array',cellDates:true})}if(isCanteenReport(book)){if(status)status.textContent='Kantinenreport erkannt · Essenszahlen, Umsatzarten, Automaten und Öffnungstage werden übernommen …';const report=extractCanteenReport(book,file.name);saveCanteenReport(report);showCanteenFeedback(report);toast(`✓ ${report.monthCount} Reporting-Monate verstanden`);return}if(!isWISAGClosing(book)){const report=genericWorkbookSummary(book,file.name);saveUnmappedReport(report);showGenericFeedback(report);toast('Datei gelesen · Zuordnung fehlt noch');return}if(status)status.textContent='Monatsabschluss erkannt · Deep Scan V7.4 läuft: alle Blätter → Vertragsmodell → Beweiskette → Konfliktprüfung …';const record=extractWISAG(book,file.name),before=sortedArchives(),existing=before.find(a=>a.key===record.key),prev=before.filter(a=>a.key<record.key).at(-1)||null,idx=state.archives.findIndex(a=>a.key===record.key&&siteIdOf(a)===state.workspace.siteId);if(idx>=0)state.archives[idx]={...record,customerCostCenters:state.archives[idx].customerCostCenters||[]};else state.archives.push(record);state.selectedMonthKey=record.key;state.analysisPointKey=record.key;addAudit('month.deep_scan.verified',`${record.month} · ${record.audit.sheetCount} Blätter · ${record.audit.confidence}% Datenvertrauen · ${record.audit.billing?.mode||'Modell erkannt'} · ${book.__native?'lokaler XLSX-Scanner':'SheetJS'}`);saveState();showClosingFeedback(record,prev);toast(`✓ ${record.month} verifiziert · Feedback bereit`)}catch(err){console.error(err);addAudit('input.file.blocked',file.name+' · '+err.message,'warn');saveState();if(status){if(err.audit){const failed=err.audit.checks.filter(x=>x.available!==false&&x.critical&&!x.ok);status.innerHTML=`<b>Nicht verifiziert: ${esc(err.message)}</b>${failed.length?`<div style="margin-top:8px">${failed.map(x=>`• ${esc(x.label)}<br><small>${esc(x.detail||'')}</small>`).join('<br>')}</div>`:''}`}else status.textContent='Nicht verwertbar: '+err.message}toast('Datei konnte nicht vollständig eingeordnet werden')}}
