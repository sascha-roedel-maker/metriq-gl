/* ===== V6.2 Theme + FLOSIQ + lever system ===== */
body[data-theme="light"]{
  --bg:#f3f1f7;--panel:#ffffff;--text:#251d45;--muted:#746e7f;--line:rgba(61,42,103,.13);--soft:rgba(82,61,132,.055);--shadow:0 16px 50px rgba(54,40,86,.10);
  background:linear-gradient(180deg,#f7f5fa 0,#f0eef5 55%,#f6f5f8 100%);

body[data-theme="light"] .brand{color:#281f48}
body[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.92);border-color:rgba(61,42,103,.10);box-shadow:0 -10px 35px rgba(62,45,91,.08)}
body[data-theme="light"] .month-nav{background:rgba(247,245,250,.94);border-color:rgba(61,42,103,.10)}

body[data-theme="light"] .verified-hero{background:linear-gradient(145deg,rgba(92,221,208,.10),#fff 47%,rgba(139,76,255,.07))}

body[data-theme="light"] .notice{background:rgba(255,210,70,.10)}
body[data-theme="light"] .flosiq-card{background:linear-gradient(145deg,#f5fbed,#fff)}
body[data-theme="light"] .lever-card{background:#fff}

function iqJson(raw,fallback=null){try{return raw==null?fallback:JSON.parse(raw)}catch{return fallback}}

async function iqCloudFetch(path,{method='GET',body,auth=true,headers={}}={}){
  if(auth)await iqEnsureSession();
  const h={apikey:IQ_CLOUD_KEY,...headers};
  if(auth&&iqCloudSession?.access_token)h.Authorization=`Bearer ${iqCloudSession.access_token}`;
  if(body!==undefined&&!h['Content-Type'])h['Content-Type']='application/json';
  const r=await fetch(IQ_CLOUD_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok){
    let detail='';
    try{const j=await r.json();detail=j.msg||j.message||j.error_description||j.error||JSON.stringify(j)}catch{detail=await r.text().catch(()=>'')}

function flosiqMonthData(key){
  const raw=flosiqRaw(),es=raw.entries.filter(x=>String(x.date||'').startsWith(key)),ms=raw.meals.filter(x=>String(x.date||'').startsWith(key));
  const meals=ms.reduce((s,x)=>s+(+x.meals||0),0);
  const waste=es.reduce((s,x)=>s+(+x.weight_kg||0),0);
  const lunchEntries=es.filter(x=>x.service==='lunch');
  const lunchWaste=lunchEntries.reduce((s,x)=>s+(+x.weight_kg||0),0);
  const unknown=es.some(x=>x.service==='unassigned');
  const foodLoss=meals>0&&lunchEntries.length&&!unknown?lunchWaste*1000/meals:null;
  const cats={plate:0,prep:0,overproduction:0,storage:0};
  es.forEach(x=>{if(cats[x.category]!=null)cats[x.category]+=+x.weight_kg||0});
  const rescues=raw.rescues.filter(x=>String(x.date||x.createdAt||'').startsWith(key));
  const decisions=raw.decisions.filter(x=>String(x.date||'').startsWith(key));
  let estimatedValue=0,valuedKg=0;
  es.forEach(x=>{
    const kg=+x.weight_kg||0;let factor=0;
    if(x.category==='plate'||x.category==='overproduction')factor=raw.costPerKg;
    else if(x.category==='prep')factor=raw.prepCostPerKg;

function attachReport(records){
  return (records||[]).map(r=>{const reportData=reportMonthData(r.key);return reportData?{...r,reportData}:r});

function rawRecordsForMetric(key){
  const closings=attachReport(sortedArchives());
  const reportMonths=allReportMonths();
  if(['revenue','warePct','personalPct','db1','inventory'].includes(key))return closings;
  if(key==='meals'){
    const map=new Map(closings.map(r=>[r.key,r]));
    for(const m of reportMonths){const base=map.get(m.key)||{key:m.key,month:m.month,metrics:{},audit:null};map.set(m.key,{...base,reportData:m,sourceKind:'report'})}
    return [...map.values()].sort((a,b)=>a.key.localeCompare(b.key));
  }
  if(['vending','reportRevenue','conference'].includes(key)){
    const map=new Map(closings.map(r=>[r.key,r]));
    for(const m of reportMonths){const base=map.get(m.key)||{key:m.key,month:m.month,metrics:{},audit:null};map.set(m.key,{...base,reportData:m,sourceKind:'report'})}
    return [...map.values()].sort((a,b)=>a.key.localeCompare(b.key)).filter(r=>{
      if(key==='vending')return Math.abs(closingVendingRevenue(r)||Number(r.reportData?.metrics?.vending)||0)>.001;
      if(key==='conference')return Math.abs(closingConferenceRevenue(r)||Number(r.reportData?.metrics?.conferenceRevenue)||0)>.001;
      return Math.abs((r.audit?closingOperatingRevenue(r):0)||Number(r.reportData?.metrics?.reportRevenue)||0)>.001;
    });
  }
  if(key==='guestsPerDay')return reportMonths.filter(m=>Number.isFinite(Number(m.metrics?.guestsPerDay))).map(m=>({key:m.key,month:m.month,reportData:m,sourceKind:'report'}));
  return closings;
}

function sheetCoverage(book){const errorRe=/^#(REF!|DIV\/0!|VALUE!|NAME\?|N\/A|NUM!|NULL!)$/i;return book.SheetNames.map(name=>{const rows=rowsOf(book,name);let nonEmptyCells=0,errors=0,month=null;for(const row of rows){for(const v of row||[]){if(v!==null&&v!==undefined&&v!=='')nonEmptyCells++;if(typeof v==='string'&&errorRe.test(v.trim()))errors++;if(!month){const k=canonicalMonthKey(v);if(k)month=k}}}return{name,nonEmptyCells,errors,month:month?monthLabel(month):null,monthKey:month}})}
function closeEnough(a,b,tol=1){return Number.isFinite(+a)&&Number.isFinite(+b)&&Math.abs(+a-(+b))<=tol}
function auditCheck(checks,label,a,b,sources,tol=1,critical=true){const valid=v=>v!==null&&v!==undefined&&v!==''&&typeof v!=='boolean'&&Number.isFinite(Number(v));if(!valid(a)||!valid(b)){checks.push({label,ok:true,available:false,critical:false,sources,detail:'Quelle nicht vollständig verfügbar'});return}a=Number(a);b=Number(b);const ok=closeEnough(a,b,tol);checks.push({label,ok,available:true,critical,sources,detail:`${sources[0]} ${euro.format(a)} ↔ ${sources[1]} ${euro.format(b)}`})}
function consensusValue(candidates,tol=1){const valid=v=>v!==null&&v!==undefined&&v!==''&&typeof v!=='boolean'&&Number.isFinite(Number(v));const vals=candidates.filter(x=>valid(x.value)).map(x=>({...x,value:Number(x.value)}));if(!vals.length)return{value:0,sources:[],agreed:false};let best=vals[0],score=-1;for(const v of vals){const count=vals.filter(x=>closeEnough(x.value,v.value,tol)).length;if(count>score){score=count;best=v}}return{value:best.value,sources:vals.filter(x=>closeEnough(x.value,best.value,tol)).map(x=>x.source),agreed:score>=Math.min(2,vals.length)}}

function costPlusContext(rb,budget){const squash=v=>String(v??'').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'');const bookings=(rb||[]).filter(x=>squash(`${x.service||''} ${x.costCenter||''}`).includes('kostenplus'));const invoice=bookings.reduce((a,x)=>a+(Number(x.net)||0),0);const raw=budget?.fee,valid=raw!==null&&raw!==undefined&&raw!==''&&typeof raw!=='boolean'&&Number.isFinite(Number(raw)),feeValue=valid?Number(raw):null;return{active:invoice>0.01,invoice,bookings,feeRate:feeValue!==null&&feeValue>0&&feeValue<0.5?feeValue:null,feeAmount:feeValue!==null&&feeValue>=0.5?feeValue:null}}

function excelMonthKey(v){if(typeof v==='number'&&Number.isFinite(v)&&v>30000&&v<70000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}const d=v instanceof Date?v:null;if(d&&!isNaN(d))return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;return canonicalMonthKey(v)}
function reportNum(v){if(typeof v==='number'&&Number.isFinite(v))return v;if(typeof v==='string'&&v.trim()&&!v.includes('#')){const x=Number(v.replace(/\./g,'').replace(',','.'));if(Number.isFinite(x))return x}return null}
function menuCategory(text){const t=norm(text);if(/\b(rind|beef|roastbeef|rinder|entrecote|steak)\b/.test(t))return'rind';if(/\b(hähnchen|haehnchen|huhn|pute|geflügel|gefluegel|chicken)\b/.test(t))return'gefluegel';if(/\b(schwein|schweine|kassler|schäufele|schaeufele)\b/.test(t))return'schwein';if(/\b(lachs|fisch|seelachs|kabeljau|forelle|thunfisch)\b/.test(t))return'fisch';if(/\b(vegan|vegetar|tofu|falafel|gemüsepfanne|gemuesepfanne)\b/.test(t))return'veggie';return'sonstiges'}
function looksLikeDish(text){const t=norm(text);if(!t||t.length<4||t.length>140)return false;if(/^(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|kw\s*\d+|woche\s*\d+|menü|menu|gericht|preis|beilage|dessert|suppe|allergen|zusatzstoff)/.test(t))return false;return /(rind|beef|hähn|haehn|huhn|pute|geflügel|gefluegel|schwein|schnitzel|braten|gulasch|wurst|curry|burger|fisch|lachs|nudel|pasta|lasagne|pizza|salat|bowl|eintopf|auflauf|knödel|knoedel|spätzle|spaetzle|kartoffel|gemüse|gemuese|vegan|vegetar|falafel|tofu|ragout|frikadelle|hack|gyros)/.test(t)}
function isMenuPlan(book){const names=(book.SheetNames||[]).map(norm);if(names.some(x=>/speiseplan|menüplan|menuplan|wochenplan/.test(x)))return true;for(const sn of book.SheetNames||[]){const rows=rowsOf(book,sn).slice(0,80),txt=rows.flat().filter(v=>typeof v==='string').map(norm);const days=txt.filter(x=>/^(montag|dienstag|mittwoch|donnerstag|freitag)$/.test(x)).length,dishes=txt.filter(looksLikeDish).length;if(days>=2&&dishes>=3)return true}return false}
function extractMenuPlan(book,fileName){let key=canonicalMonthKey(fileName),keySource=key?'Dateiname':'aktueller Monat';const dishes=[],seen=new Set(),specials=[];for(const sn of book.SheetNames||[]){for(const row of rowsOf(book,sn).slice(0,180)){for(const v of row||[]){if(typeof v!=='string')continue;const raw=v.replace(/\s+/g,' ').trim();if(!key){const k=excelMonthKey(raw)||canonicalMonthKey(raw);if(k){key=k;keySource='Dateiinhalt'}}if(/aktion|special|themenwoche|burger.?woche|grill.?woche/i.test(raw)&&!specials.includes(raw))specials.push(raw.slice(0,120));if(looksLikeDish(raw)){const k=norm(raw);if(!seen.has(k)){seen.add(k);dishes.push({name:raw.slice(0,140),category:menuCategory(raw)})}}}}}
  if(!key)key=liveMonthMeta().key;
  if(!dishes.length)throw new Error('Speiseplan erkannt, aber keine Gerichte sicher auslesbar');
  const counts={rind:0,gefluegel:0,schwein:0,fisch:0,veggie:0,sonstiges:0};for(const d of dishes)counts[d.category]=(counts[d.category]||0)+1;const known=dishes.length,vegShare=known?counts.veggie/known*100:0;
  return{id:(crypto.randomUUID?.()||String(Date.now())+Math.random()),siteId:state.workspace.siteId,type:'menu-plan',source:fileName,importedAt:new Date().toISOString(),key,month:monthLabel(key),keySource,dishes,counts,vegShare,specials:specials.slice(0,8)}
}

function showMenuPlanFeedback(plan){const c=plan.counts||{},meat=(c.rind||0)+(c.gefluegel||0)+(c.schwein||0);$('#modalBody').innerHTML=`<h2>✓ Speiseplan verstanden</h2><p class="help-copy"><b>${esc(plan.source)}</b><br>${plan.month} · ${plan.dishes.length} Gerichte erkannt${plan.keySource==='aktueller Monat'?' · Zeitraum aus aktuellem Monat abgeleitet':''}.</p><div class="feedback-grid"><div><small>Rind</small><strong>${fmt(c.rind)}</strong></div><div><small>Geflügel</small><strong>${fmt(c.gefluegel)}</strong></div><div><small>Vegetarisch / vegan</small><strong>${fmt(c.veggie)}</strong></div><div><small>Fleischgerichte erkannt</small><strong>${fmt(meat)}</strong></div></div><div class="source-note"><b>Was bringt uns das?</b><p>MetriQ kann Einkaufsauffälligkeiten jetzt gegen den tatsächlichen Speiseplan spiegeln. Beispiel: höhere Metzgereikosten + mehrere Rindgerichte → konkrete, aber als Empfehlung gekennzeichnete Alternative statt „Positionen prüfen“.</p></div>${plan.specials?.length?`<div class="source-note"><b>Aktionen erkannt</b><p>${plan.specials.slice(0,3).map(esc).join(' · ')}</p></div>`:''}<button id="menuFeedbackClose" class="primary" style="width:100%;margin-top:14px">Verstanden → Live</button>`;$('#menuFeedbackClose').onclick=()=>{closeModal();state.active='live';saveState();render();scrollTo({top:0,behavior:'smooth'})}}
function isWISAGClosing(book){const names=new Set((book.SheetNames||[]).map(norm));return names.has(norm('Ergebnisblatt Schnelle Zahlen'))&&names.has(norm('Ergebnis Teilbetriebe'))&&names.has(norm('REB'))}
function genericWorkbookSummary(book,fileName){const sheets=[],months=new Set();let numericCells=0,textCells=0;for(const sn of book.SheetNames||[]){const rows=rowsOf(book,sn),maxCols=rows.reduce((m,r)=>Math.max(m,r?.length||0),0);sheets.push({name:sn,rows:rows.length,cols:maxCols});for(const row of rows.slice(0,120)){for(const v of row||[]){if(typeof v==='number'&&Number.isFinite(v))numericCells++;else if(typeof v==='string'&&v.trim())textCells++;const k=excelMonthKey(v);if(k)months.add(k)}}}return{id:(crypto.randomUUID?.()||String(Date.now())+Math.random()),siteId:state.workspace.siteId,type:'unmapped-report',source:fileName,importedAt:new Date().toISOString(),sheetCount:sheets.length,sheets,months:[...months].sort(),numericCells,textCells}}

function showGenericFeedback(report){$('#modalBody').innerHTML=`<h2>Datei gelesen – Bedeutung noch nicht sicher</h2><p class="help-copy"><b>${esc(report.source)}</b><br>${report.sheetCount} Tabellenblatt${report.sheetCount===1?'':'-Blätter'} · ${fmt(report.numericCells)} Zahlenzellen erkannt${report.months.length?` · Monatsbezüge ${report.months.map(monthShort).join(', ')}`:''}.</p><div class="source-note"><b>Was MetriQ schon weiß</b><p>${report.sheets.slice(0,6).map(x=>`${esc(x.name)} (${x.rows}×${x.cols})`).join(' · ')}</p></div><div class="notice" style="margin-top:12px"><div class="ico">?</div><div><b>Diese Quelle braucht noch eine Adapter-Regel.</b><p>MetriQ speichert die Quelle als „noch nicht zugeordnet“, übernimmt aber bewusst keine Zahlen in deine Analysen, solange deren fachliche Bedeutung nicht sicher ist. So wird aus „alles einlesen“ kein „alles irgendwie zusammenrechnen“.</p></div></div><button id="closeGeneric" class="primary" style="width:100%;margin-top:14px">Verstanden</button>`;$('#closeGeneric').onclick=closeModal}
function isCanteenReport(book){for(const sn of book.SheetNames||[]){const rows=rowsOf(book,sn),labels=rows.slice(0,60).map(r=>norm(r?.[0])).join('|');if(labels.includes('anzahl verkaufte mittagessen')&&labels.includes('umsatz automatenverkauf')&&labels.includes('gesamtumsatz'))return true}return false}
function extractCanteenReport(book,fileName){
  let sheetName=null,rows=null;
  for(const sn of book.SheetNames||[]){
    const rr=rowsOf(book,sn),labels=rr.slice(0,60).map(r=>norm(r?.[0])).join('|');
    if(labels.includes('anzahl verkaufte mittagessen')&&labels.includes('umsatz automatenverkauf')&&labels.includes('gesamtumsatz')){sheetName=sn;rows=rr;break}
  }
  if(!rows)throw new Error('Kantinenreport-Struktur nicht erkannt');
  const head=rows[0]||[],monthCols=[];
  for(let col=0;col<head.length;col++){const key=excelMonthKey(head[col]);if(key)monthCols.push({col,key})}
  if(!monthCols.length)throw new Error('Keine Monats-Spalten im Kantinenreport erkannt');
  const months=[];
  for(const mc of monthCols){
    let group='',groups={},scalars={};
    for(let i=1;i<rows.length;i++){
      const row=rows[i]||[],label=String(row[0]??'').trim(),sub=String(row[2]??'').trim(),val=reportNum(row[mc.col]);
      if(label)group=label;
      if(val===null)continue;
      if(label&&!sub)scalars[label]=val;
      if(group&&sub){groups[group]=groups[group]||{};groups[group][sub]=val}
    }
    const getGroup=(label)=>{const k=Object.keys(groups).find(x=>norm(x)===norm(label));return k?groups[k]:{}};
    const getScalar=(label)=>{const k=Object.keys(scalars).find(x=>norm(x)===norm(label));return k?scalars[k]:null};
    const sumMap=(m,skipTotal=false)=>Object.entries(m||{}).filter(([k,v])=>Number.isFinite(Number(v))&&(!skipTotal||norm(k)!=='gesamtumsatz')).reduce((a,[,v])=>a+Number(v),0);
    const meals=getGroup('Anzahl verkaufte Mittagessen'),
          lunch=getGroup('Umsatz Mittagessen'),
          snacks=getGroup('Umsatz Zwischenverpflegung'),
          drinks=getGroup('Umsatz Getränke u. Pfand'),
          retail=getGroup('Umsatz Handelswaren'),
          conference=getGroup('Umsatz Konferenzerlöse'),
          vending=getGroup('Umsatz Automatenverkauf'),
          vouchers=getGroup('Wert Gutscheine'),
          totals=getGroup('Gesamtumsatz');
    const totalKey=Object.keys(totals).find(k=>norm(k)==='gesamtumsatz'),
          conferenceSummaryKey=Object.keys(totals).find(k=>norm(k)==='konferenzen'),
          reportedGrandTotal=totalKey!==undefined?Number(totals[totalKey]||0):null,
          conferenceSummary=conferenceSummaryKey!==undefined?Number(totals[conferenceSummaryKey]||0):0,
          conferenceRevenue=sumMap(conference),
          operatingDetailRevenue=sumMap(lunch)+sumMap(snacks)+sumMap(drinks)+sumMap(retail)+sumMap(vending),
          reportRevenue=operatingDetailRevenue+conferenceRevenue,
          reportedFormulaGap=reportedGrandTotal===null?null:reportedGrandTotal-reportRevenue,
          metrics={
            meals:sumMap(meals),
            openingDays:getScalar('Öffnungstage')??0,
            guestsPerDay:getScalar('Tischgäste pro Öffnungstag')??0,
            lunchRevenue:sumMap(lunch),
            snackRevenue:sumMap(snacks),
            drinksRevenue:sumMap(drinks),
            retailRevenue:sumMap(retail),
            conferenceRevenue,
            conferenceSummary,
            conferenceDelta:conferenceRevenue-conferenceSummary,
            vending:sumMap(vending),
            voucherValue:sumMap(vouchers),
            operatingDetailRevenue,
            reportRevenue,
            reportedGrandTotal,
            reportedFormulaGap,
            goodsCosts:getScalar('Warenkosten'),
            personnelCosts:getScalar('Personalkosten'),
            overheadCosts:getScalar('Gemeinkosten'),
            totalCosts:getScalar('Gesamt-Kosten'),
            advance:getScalar('mtl. Abschlagszahlung RIBE'),
            coverage:getScalar('Über-/Unterdeckung'),
            settlement:getScalar('Spitzabrechnung')
          };
    const meaningful=[metrics.meals,metrics.reportRevenue,metrics.vending,metrics.conferenceRevenue,metrics.goodsCosts,metrics.personnelCosts].some(v=>Number.isFinite(Number(v))&&Math.abs(Number(v))>.001);
    if(meaningful)months.push({
      key:mc.key,month:monthLabel(mc.key),metrics,
      breakdowns:{
        meals,lunch,snacks,drinks,retail,conference,vending,vouchers,
        totalRevenue:Object.fromEntries(Object.entries(totals).filter(([k])=>norm(k)!=='gesamtumsatz'))
      }
    });
  }
  if(!months.length)throw new Error('Kantinenreport erkannt, aber keine befüllten Monate gefunden');
  return{id:(crypto.randomUUID?.()||String(Date.now())+Math.random()),siteId:state.workspace.siteId,type:'canteen-report',source:fileName,sheetName,importedAt:new Date().toISOString(),months:months.sort((a,b)=>a.key.localeCompare(b.key)),monthCount:months.length}
}

<script id="metriq-meal-truth-script-v1">
/* ===== MetriQ · gemeinsame Essenszahl / FLOSIQ Verifizierung ===== */
(()=>{
const MEAL_ALLOWED=new Set(["pending","provisional","verified","billed"]);
function mtMealNormalize(x={}){
  const meals=Number(x.meals||0);
  let status=String(x.status||"").toLowerCase();
  if(!MEAL_ALLOWED.has(status))status=meals>0?"provisional":"pending";
  return {...x,meals,status,source:x.source||"legacy"};
}
function mtMealRows(){
  const s=iqCloudFlosiqSnapshot;
  return Array.isArray(s?.meals)?s.meals.map(mtMealNormalize):[];
}
function mtMealRecord(date){
  return mtMealRows().find(x=>x.date===date)||null;
}
function mtMealStatusInfo(row){
  if(!row)return{cls:"pending",label:"noch offen",detail:"In FLOSIQ liegt für diesen Tag noch keine Essenszahl vor."};
  if(row.status==="verified"||row.status==="billed")return{cls:"verified",label:"verifiziert",detail:`${Number(row.meals||0).toLocaleString("de-DE")} Essen sind als gemeinsame Zahl bestätigt.`};
  if(row.status==="provisional")return{cls:"provisional",label:"vorläufig",detail:`FLOSIQ meldet ${Number(row.meals||0).toLocaleString("de-DE")} Essen. Die Zahl wartet noch auf Management-Bestätigung.`};
  return{cls:"pending",label:"noch offen",detail:"Der operative Mitarbeiter hat angegeben, dass die Essenszahl noch nicht vorliegt."};
}
function mtMealMonthStats(key){
  const rows=mtMealRows().filter(x=>String(x.date||"").startsWith(key));
  const positive=rows.filter(x=>Number(x.meals)>0);
  const provisional=positive.filter(x=>x.status==="provisional");
  const verified=positive.filter(x=>x.status==="verified"||x.status==="billed");
  const pending=rows.filter(x=>x.status==="pending");
  return{
    rows,positive,provisional,verified,pending,
    meals:positive.reduce((s,x)=>s+Number(x.meals||0),0),
    status:provisional.length?"provisional":verified.length?"verified":pending.length?"pending":"missing"
  };
}
async function mtWriteMeal(date,meals,{source="metriq_gl"}={}){
  if(!iqCloudUserId())throw new Error("Bitte zuerst IQ-Versum Cloud verbinden.");
  if(!iqCloudFlosiqSnapshot)await iqFetchFlosiqSnapshot({silent:true});
  if(!iqCloudFlosiqSnapshot)throw new Error("Noch kein FLOSIQ-Datenstand vorhanden.");
  const now=new Date().toISOString();
  const payload=JSON.parse(JSON.stringify(iqCloudFlosiqSnapshot));
  const rows=Array.isArray(payload.meals)?payload.meals.map(mtMealNormalize):[];
  const idx=rows.findIndex(x=>x.date===date);
  const before=idx>=0?rows[idx]:null;
  const row={
    ...(before||{}),
    date,
    meals:Number(meals),
    status:"verified",
    source,
    updated_at:now,
    verified_at:now,
    verified_by:"MetriQ GL",
    provisional_meals:before?.status==="provisional"?Number(before.meals||0):(before?.provisional_meals??null),
    provisional_source:before?.status==="provisional"?(before.source||"operational"):(before?.provisional_source??null)
  };
  if(idx>=0)rows[idx]=row;else rows.push(row);
  payload.meals=rows;
  payload.generated_at=now;
  payload.storage={...(payload.storage||{}),nm_meals:JSON.stringify(rows)};
  const body=[{
    user_id:iqCloudUserId(),
    site_key:IQ_SITE_KEY,
    record_type:IQ_FLOSIQ_RECORD_TYPE,
    record_key:IQ_FLOSIQ_RECORD_KEY,
    record_date:null,
    payload,
    updated_at:now
  }];
  const q=new URLSearchParams({on_conflict:"user_id,site_key,record_type,record_key"});
  await iqCloudFetch(`/rest/v1/iq_sync_records?${q.toString()}`,{
    method:"POST",
    body,
    headers:{Prefer:"resolution=merge-duplicates,return=minimal"}
  });
  iqCloudFlosiqSnapshot=payload;
  iqCloudFlosiqUpdatedAt=now;
  state.flosiq={...(state.flosiq||{}),enabled:true,mode:"iq-cloud",lastSync:now};
  state.integrations={...(state.integrations||{}),cloud:{...(state.integrations?.cloud||{}),status:"connected",provider:"Supabase · IQ-Versum Core",lastSync:now}};
  addAudit("meals.verified",`${date} · ${Number(meals)} Essen · MetriQ GL`);
  saveState();
  return row;
}

const baseFlosiqMonthDataMealTruth=flosiqMonthData;
flosiqMonthData=function(key){
  const out=baseFlosiqMonthDataMealTruth(key);
  if(out.source!=="cloud")return out;
  const s=mtMealMonthStats(key);
  return {...out,mealStatus:s.status,mealProvisionalDays:s.provisional.length,mealVerifiedDays:s.verified.length,mealPendingDays:s.pending.length};
};

function mtMealTruthCard(){
  if(!iqCloudUserId()||!iqCloudFlosiqSnapshot)return"";
  const today=new Date().toISOString().slice(0,10),row=mtMealRecord(today),info=mtMealStatusInfo(row);
  const value=row&&row.status!=="pending"?`${Number(row.meals||0).toLocaleString("de-DE")} Essen`:"—";
  return`<div class="meal-truth-card reveal-card">
    <div><b>Essenszahl heute</b><small>${info.detail}</small></div>
    <div class="meal-truth-value"><strong>${value}</strong><span class="${info.cls}">${info.label.toUpperCase()}</span></div>
    <div class="meal-truth-actions"><button class="ghost compact" data-verify-meal="${today}">${row?.status==="verified"||row?.status==="billed"?"Bestätigung prüfen":"Essenszahl bestätigen"}</button></div>
  </div>`;
}
function mtOpenMealVerify(date=new Date().toISOString().slice(0,10)){
  if(!can("live.write"))return toast("Keine Berechtigung");
  const row=mtMealRecord(date),info=mtMealStatusInfo(row),val=row&&row.status!=="pending"?Number(row.meals||0):"";
  openModal(`<h2>Essenszahl verifizieren</h2>
    <p class="help-copy">${date.split("-").reverse().join(".")} · FLOSIQ bleibt die operative Quelle, MetriQ bestätigt die gemeinsame Essenszahl.</p>
    <div class="meal-status-note"><b>${info.label.toUpperCase()}</b><br>${info.detail}</div>
    <div class="field"><label>Richtige Essenszahl</label><input id="mtVerifyMeals" type="number" min="0" step="1" inputmode="numeric" value="${val}"></div>
    <button id="mtVerifyMealSave" class="primary" style="width:100%;margin-top:14px">Verifizieren</button>
    <p class="help-copy" style="margin-top:10px">Eine bereits verifizierte Zahl kann hier korrigiert und erneut bestätigt werden. Die ursprüngliche vorläufige Angabe bleibt im Datensatz als Herkunft erhalten.</p>`);
  $("#mtVerifyMealSave").onclick=async()=>{
    const raw=$("#mtVerifyMeals").value,n=Number(raw),b=$("#mtVerifyMealSave");
    if(raw===""||!Number.isInteger(n)||n<0)return toast("Bitte ganze Essenszahl eingeben");
    b.disabled=true;b.textContent="Speichere …";
    try{
      await mtWriteMeal(date,n);
      closeModal();render();toast("Essenszahl verifiziert ✓");
    }catch(e){
      b.disabled=false;b.textContent="Verifizieren";toast(e.message||"Verifizierung fehlgeschlagen");
    }
  };
}

const baseLiveViewMealTruth=liveView;
liveView=function(){
  const key=liveMonthMeta().key,f=flosiqMonthData(key);
  let html=baseLiveViewMealTruth();
  const insertion=mtMealTruthCard();
  if(insertion){
    const needle='<div class="section-head"><div><div class="eyebrow">AKTUELLER MONAT</div>';
    html=html.replace(needle,insertion+needle);
  }
  if(f.source==="cloud"){
    const extra=f.mealProvisionalDays?` · ${f.mealProvisionalDays} Tag${f.mealProvisionalDays===1?"":"e"} vorläufig`:f.mealVerifiedDays?` · ${f.mealVerifiedDays} Tag${f.mealVerifiedDays===1?"":"e"} verifiziert`:"";
    html=html.replace('automatisch aus FLOSIQ</div>',`automatisch aus FLOSIQ${extra}</div>`);
    if(f.mealProvisionalDays)html=html.replace('<span>je Mittagessen</span>','<span>je Mittagessen · vorläufig</span>');
    else if(f.mealVerifiedDays)html=html.replace('<span>je Mittagessen</span>','<span>je Mittagessen · verifiziert</span>');
  }
  return html;
};

const baseBindScreenMealTruth=bindScreen;
bindScreen=function(){
  baseBindScreenMealTruth();
  $$("[data-verify-meal]").forEach(b=>b.onclick=()=>mtOpenMealVerify(b.dataset.verifyMeal));
};

openDailyModal=function(){
  if(!can("live.write"))return toast("Keine Berechtigung für Live-Erfassung");
  const lm=liveMonthMeta(),f=flosiqMonthData(lm.key),today=new Date().toISOString().slice(0,10),mealRow=f.connected?mtMealRecord(today):null,mealInfo=mtMealStatusInfo(mealRow);
  const mealValue=mealRow&&mealRow.status!=="pending"?Number(mealRow.meals||0):"";
  openModal(`<h2>Heute in MetriQ</h2><p class="help-copy">${lm.label} · nur echte Ist-Daten.${f.connected?" Food Waste kommt automatisch aus FLOSIQ. Die Essenszahl kannst du hier bei Bedarf verifizieren.":""}</p>
    <div class="form-grid">
      <div class="field"><label>Datum</label><input id="dDate" type="date" value="${today}"></div>
      <div class="field"><label>${f.connected?"Essenszahl bestätigen / korrigieren · optional":"Essen"}</label><input id="dMeals" type="number" min="0" step="1" value="${f.connected?"":mealValue}" placeholder="${f.connected?(mealValue!==""?`Aktuell ${mealValue}`:"z. B. 50"):""}"></div>
      <div class="field"><label>Tageserlös €</label><input id="dRevenue" type="number" step=".01" min="0"></div>
      <div class="field"><label>Warenzugang €</label><input id="dGoods" type="number" step=".01" min="0"></div>
    </div>
    ${f.connected?`<div id="dMealStatus" class="meal-status-note"><b>${mealInfo.label.toUpperCase()}</b><br>${mealInfo.detail}<br>Feld leer lassen = Essenszahl nicht verändern.</div>`:""}
    <div class="field"><label>Besonderheit / Notiz</label><input id="dNote" placeholder="Event, Ausfall, Lieferproblem …"></div>
    <button id="saveDay" class="primary" style="width:100%;margin-top:14px">Tag speichern</button>`);
  const refreshMealUi=()=>{
    if(!f.connected)return;
    const date=$("#dDate").value,row=mtMealRecord(date),info=mtMealStatusInfo(row),input=$("#dMeals");
    input.value="";
    input.placeholder=row&&row.status!=="pending"?`Aktuell ${Number(row.meals||0)}`:"z. B. 50";
    const st=$("#dMealStatus");if(st)st.innerHTML=`<b>${info.label.toUpperCase()}</b><br>${info.detail}<br>Feld leer lassen = Essenszahl nicht verändern.`;
  };
  $("#dDate").addEventListener("change",refreshMealUi);
  $("#saveDay").onclick=async()=>{
    const b=$("#saveDay"),date=$("#dDate").value,mealRaw=$("#dMeals")?.value??"";
    b.disabled=true;b.textContent="Speichere …";
    try{
      if(f.connected&&mealRaw!==""){
        const n=Number(mealRaw);
        if(!Number.isInteger(n)||n<0)throw new Error("Bitte ganze Essenszahl eingeben.");
        await mtWriteMeal(date,n);
      }
      const e={siteId:state.workspace.siteId,date,meals:f.connected?0:(+mealRaw||0),revenue:+$("#dRevenue").value||0,goods:+$("#dGoods").value||0,note:$("#dNote").value.trim()},
        idx=state.live.entries.findIndex(x=>x.date===e.date);
      if(idx>=0)state.live.entries[idx]=e;else state.live.entries.push(e);
      state.live.monthKey=e.date.slice(0,7);
      addAudit("live.day.saved",e.date+" · "+e.revenue.toFixed(2)+" € Erlös");
      saveState();closeModal();render();toast(f.connected&&mealRaw!==""?"Tag gespeichert · Essenszahl verifiziert ✓":"Live-Monat aktualisiert");
    }catch(err){
      b.disabled=false;b.textContent="Tag speichern";toast(err.message||"Speichern fehlgeschlagen");
    }
  };
};

window.METRIQ_MEAL_TRUTH={record:mtMealRecord,verify:mtWriteMeal,open:mtOpenMealVerify,month:mtMealMonthStats};
})();
</script>
